<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess（アンドプリンセス）- 出張型ドレス＆撮影会イベント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #fce8f3;
            --primary-purple: #f3ebfa;
            --accent-gold: #dfb15b;
            --text-main: #5a4b5e;
            --text-sub: #84757c;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #fce8f3 0%, #e9d5f0 50%, #f3ebfa 100%);
            color: var(--text-main);
            line-height: 1.6;
            padding-top: 55px; /* 上部バーの高さ分 */
            padding-bottom: 110px; /* 下部バーの高さ分 */
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* キラキラ・真珠エフェクト */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255,255,255,0.8) 0, transparent 4px),
                radial-gradient(circle at 85% 15%, rgba(255,255,255,0.6) 0, transparent 6px),
                radial-gradient(circle at 25% 75%, rgba(255,255,255,0.7) 0, transparent 5px),
                radial-gradient(circle at 75% 85%, rgba(255,255,255,0.9) 0, transparent 4px),
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.4) 0, transparent 8px);
            pointer-events: none;
            z-index: 0;
        }

        /* お城のシルエット背景 */
        .castle-bg {
            position: fixed;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 350px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="none"><path d="M550,150 L550,100 L560,90 L560,70 L565,65 L565,50 L570,45 L570,30 L575,25 L580,30 L580,45 L585,50 L585,65 L590,70 L590,90 L600,100 L600,150 L650,150 L650,120 L660,110 L660,95 L665,90 L665,80 L675,70 L685,80 L685,90 L690,95 L690,110 L700,120 L700,150 L850,150 L850,200 L1200,400 L0,400 L350,200 L350,150 Z" fill="rgba(255,255,255,0.25)"/></svg>') no-repeat bottom center;
            background-size: cover;
            pointer-events: none;
            z-index: 0;
        }

        /* ブラウザ・トップバー（固定） */
        .browser-top {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(223, 177, 91, 0.3);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
        }

        .browser-top-left, .browser-top-right {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-main);
            font-size: 16px;
        }

        .address-bar {
            background: rgba(240, 230, 245, 0.7);
            padding: 6px 24px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(223, 177, 91, 0.4);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        /* メインコンテンツラッパー */
        .page-wrapper {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ヘッダー */
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(223, 177, 91, 0.15);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 18px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .header-btn {
            background: linear-gradient(135deg, #dfb15b 0%, #c4963e 100%);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 18px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 8px rgba(223, 177, 91, 0.3);
        }

        /* ヒーローセクション */
        .hero {
            padding: 28px 20px 20px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.85);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 18px;
            margin-bottom: 18px;
            border: 1px solid rgba(223, 177, 91, 0.4);
            box-shadow: 0 3px 10px rgba(223, 177, 91, 0.1);
        }

        .hero h1 {
            font-size: 21px;
            color: var(--text-main);
            line-height: 1.65;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.7;
        }

        /* コンテナカード */
        .card-box {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px 16px;
            margin-bottom: 28px;
            border: 2px dashed rgba(223, 177, 91, 0.45);
            box-shadow: 0 8px 25px rgba(223, 177, 91, 0.1);
        }

        .card-box p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.6;
        }

        /* ボタン */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-line {
            background: linear-gradient(135deg, #fff5f8 0%, #fce4ef 100%);
            color: #c95484;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.2);
        }

        .btn-mail {
            background: var(--white);
            color: var(--text-main);
            border: 2px solid #eab6cc;
            box-shadow: 0 3px 10px rgba(234, 182, 204, 0.15);
        }

        /* セクション */
        section {
            padding: 0 20px 24px;
        }

        .section-title {
            text-align: center;
            font-size: 18px;
            color: var(--text-main);
            margin-bottom: 16px;
            font-weight: 700;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 25px;
            height: 3px;
            background: var(--accent-gold);
            margin: 5px auto 0;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(5px);
            border-radius: 20px;
            padding: 28px;
            text-align: center;
            border: 2px dashed rgba(223, 177, 91, 0.4);
            color: var(--text-sub);
        }

        .gallery-card .icon {
            font-size: 34px;
            margin-bottom: 6px;
            color: var(--accent-gold);
        }

        .gallery-card p {
            font-size: 12.5px;
        }

        /* ブラウザ・ボトムバー（固定） */
        .browser-bottom {
            background: rgba(245, 238, 248, 0.95);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(223, 177, 91, 0.3);
            box-shadow: 0 -4px 20px rgba(223, 177, 91, 0.15);
            z-index: 100;
        }

        .browser-bottom-icon {
            font-size: 18px;
            color: var(--text-main);
        }

        .url-display-bar {
            background: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-sub);
            text-align: center;
            border: 1px solid rgba(223, 177, 91, 0.3);
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- ブラウザ上部バー -->
    <div class="browser-top">
        <div class="browser-top-left">
            <span>✕</span>
        </div>
        <div class="address-bar">
            <span>🔒</span> &Princess Official
        </div>
        <div class="browser-top-right">
            <span>⚡</span>
            <span>•••</span>
        </div>
    </div>

    <div class="castle-bg"></div>

    <div class="page-wrapper">
        <!-- ヘッダー -->
        <header>
            <a href="#" class="logo-area">
                <span class="logo-icon">👑</span>
                <span class="logo-text">&Princess</span>
            </a>
            <a href="#" class="header-btn">ご相談・お見積り</a>
        </header>

        <!-- ヒーローセクション -->
        <section class="hero">
            <div class="hero-badge">商業施設・店舗イベント専用プラン</div>
            <h1>
                お城のドレス、カメラのまばたき。<br>
                小さな憧れに魔法をかけて<br>
                物語の世界へご案内いたします。
            </h1>
            <p class="hero-desc">
                各種店舗・商業施設のファミリー集客に。<br>
                アンケート回答や相談会の強力なフックとなる、<br>
                出張型ドレス＆撮影会イベント『&Princess』
            </p>

            <div class="card-box">
                <p>お気軽にお問い合わせ・お見積り</p>
                <div class="cta-container">
                    <a href="#" class="btn btn-line">
                        ✨ 公式LINEでお問い合わせ・ご相談
                    </a>
                    <a href="#" class="btn btn-mail">
                        ✉️ メールでお問い合わせ・お見積り
                    </a>
                </div>
            </div>
        </section>

        <!-- イベント風景 -->
        <section>
            <h2 class="section-title">&Princessが選ばれる理由</h2>
            <div class="gallery-card">
                <div class="icon">🏰</div>
                <p>イベント風景 01</p>
            </div>
        </section>
    </div>

    <!-- ブラウザ下部バー -->
    <div class="browser-bottom">
        <span class="browser-bottom-icon">💎</span>
        <span class="browser-bottom-icon">👑</span>
        <span class="browser-bottom-icon">✨</span>
        <span class="browser-bottom-icon">📖</span>
        <span class="browser-bottom-icon">❏</span>
    </div>

</body>
</html>
