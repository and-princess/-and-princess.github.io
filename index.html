<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess（アンドプリンセス）- 出張型ドレス＆撮影会イベント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-pink: #fce8f3;
            --primary-purple: #f3ebfa;
            --accent-gold: #dfb15b;
            --text-main: #5a4b5e;
            --text-sub: #84757c;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, var(--primary-pink) 0%, var(--primary-purple) 100%);
            color: var(--text-main);
            line-height: 1.6;
            padding-bottom: 100px;
        }

        /* 模擬ブラウザ・トップバー */
        .browser-top {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(223, 177, 91, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .browser-top-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .browser-icon {
            font-size: 18px;
            color: var(--text-main);
        }

        .address-bar {
            background: #f4edf7;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(223, 177, 91, 0.4);
        }

        /* ヘッダー */
        header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-btn {
            background: linear-gradient(135deg, #dfb15b 0%, #c4963e 100%);
            color: var(--white);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 2px 10px rgba(223, 177, 91, 0.3);
        }

        /* ヒーローセクション */
        .hero {
            padding: 30px 20px 20px;
            text-align: center;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.9);
            color: var(--text-main);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(223, 177, 91, 0.4);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.1);
        }

        .hero h1 {
            font-size: 22px;
            color: var(--text-main);
            line-height: 1.7;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .hero p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 25px;
            padding: 0 10px;
        }

        /* コンテナカード */
        .card-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 24px 16px;
            max-width: 440px;
            margin: 0 auto 30px;
            border: 2px dashed rgba(223, 177, 91, 0.4);
            box-shadow: 0 10px 30px rgba(223, 177, 91, 0.1);
        }

        .card-box p {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 20px;
            text-align: center;
        }

        /* ボタン */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-line {
            background: linear-gradient(135deg, #fff0f5 100%, #fce6f3 0%);
            color: #d15284;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.2);
        }

        .btn-mail {
            background: var(--white);
            color: var(--text-main);
            border: 2px solid #eab6cc;
        }

        /* セクション */
        section {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            text-align: center;
            font-size: 20px;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 700;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 30px;
            height: 3px;
            background: var(--accent-gold);
            margin: 6px auto 0;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 2px dashed rgba(223, 177, 91, 0.4);
            color: var(--text-sub);
        }

        .gallery-card .icon {
            font-size: 36px;
            margin-bottom: 8px;
            color: var(--accent-gold);
        }

        /* 模擬ブラウザ・ボトムバー */
        .browser-bottom {
            background: rgba(245, 238, 248, 0.95);
            backdrop-filter: blur(12px);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(223, 177, 91, 0.3);
            box-shadow: 0 -4px 20px rgba(223, 177, 91, 0.15);
            z-index: 100;
        }

        .browser-bottom-icon {
            font-size: 18px;
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <!-- ブラウザ上部バー -->
    <div class="browser-top">
        <div class="browser-top-left">
            <span class="browser-icon">✕</span>
        </div>
        <div class="address-bar">
            <span>👑</span> &Princess Official
        </div>
        <div class="browser-top-left">
            <span class="browser-icon">⚡</span>
            <span class="browser-icon">•••</span>
        </div>
    </div>

    <!-- ヘッダー -->
    <header>
        <a href="#" class="logo-area">
            <span class="logo-icon">👑</span>
            <span class="logo-text">&Princess</span>
        </a>
        <a href="#" class="header-btn">ご相談・お見積り</a>
    </header>

    <!-- ヒーローセクション -->
    <section class="hero">
        <div class="hero-badge">商業施設・店舗イベント専用プラン</div>
        <h1>
            お城のドレス、カメラのまばたき。<br>
            小さな憧れに魔法をかけて<br>
            物語の世界へご案内いたします。
        </h1>

        <div class="card-box">
            <p>
                各種店舗・商業施設のファミリー集客に。<br>
                アンケート回答や相談会の強力なフックとなる、出張型ドレス＆撮影会イベント『&Princess』
            </p>
            <div class="cta-container">
                <a href="#" class="btn btn-line">
                    ✨ 公式LINEでお問い合わせ・ご相談
                </a>
                <a href="#" class="btn btn-mail">
                    ✉️ メールでお問い合わせ・お見積り
                </a>
            </div>
        </div>
    </section>

    <!-- イベント風景 -->
    <section>
        <h2 class="section-title">イベント風景</h2>
        <div class="gallery-card">
            <div class="icon">🏰</div>
            <p>イベント風景 01</p>
        </div>
    </section>

    <!-- ブラウザ下部バー -->
    <div class="browser-bottom">
        <span class="browser-bottom-icon">💎</span>
        <span class="browser-bottom-icon">👑</span>
        <span class="browser-bottom-icon">✨</span>
        <span class="browser-bottom-icon">📖</span>
        <span class="browser-bottom-icon">❏</span>
    </div>

</body>
</html>
