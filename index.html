<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess（アンドプリンセス） | 商業施設・店舗イベント専用プラン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        body {
            /* 送ってくれた画像のような、幻想的でふわふわしたグラデーション＆光の演出 */
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 35%, #e1bee7 70%, #d1c4e9 100%);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #4a404b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px 60px 16px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* キラキラ光るエフェクトの重ね合わせ */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(white 15%, transparent 16%),
                radial-gradient(rgba(255,255,255,0.8) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            opacity: 0.35;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            position: relative;
            z-index: 1;
        }

        .badge {
            background: linear-gradient(135deg, #b897be 0%, #95759b 100%);
            color: #ffffff;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 24px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(184, 151, 190, 0.4);
            letter-spacing: 0.05em;
            border: 1px solid rgba(255, 255, 255, 0.6);
            margin-top: 10px;
        }

        .hero-text {
            text-align: center;
            line-height: 1.8;
            margin: 10px 0;
        }

        .hero-text h1 {
            font-size: 18px;
            font-weight: 700;
            color: #4a404b;
            margin-bottom: 10px;
            letter-spacing: 0.03em;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }

        .hero-text p {
            font-size: 14px;
            color: #6d5e6e;
            font-weight: 400;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px dashed #e2cdd7;
            border-radius: 28px;
            padding: 24px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(180, 150, 165, 0.18);
        }

        .card-desc {
            font-size: 12.5px;
            line-height: 1.7;
            text-align: center;
            color: #6d5e6e;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(210, 164, 184, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-line {
            background: linear-gradient(135deg, #d2a4b8 0%, #b88fa3 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .btn-mail {
            background: rgba(255, 255, 255, 0.9);
            color: #7a657c;
            border: 1.5px solid #d2a4b8;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #5c4d5d;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.05em;
            position: relative;
            text-shadow: 0 1px 2px rgba(255,255,255,0.8);
        }

        .section-title::after {
            content: '';
            display: block;
            width: 30px;
            height: 2px;
            background: #d2a4b8;
            margin: 6px auto 0 auto;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px dashed #e2cdd7;
            border-radius: 28px;
            padding: 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 10px 30px rgba(180, 150, 165, 0.18);
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f7edf2 0%, #ecdfee 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b87a0;
            font-size: 13px;
            border: 1px solid #e2d1dc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部バッジ -->
        <div class="badge">
            ✨ 商業施設・店舗イベント専用プラン ✨
        </div>

        <!-- キャッチコピー -->
        <div class="hero-text">
            <h1>お城のドレス、カメラのまばたき。<br>小さな憧れに魔法をかけて<br>物語の世界へご案内いたします。</h1>
            <p>各種店舗・商業施設のファミリー集客に。<br>アンケート回答や相談会の強力なフックとなる、<br>出張型ドレス＆撮影会イベント『&Princess』</p>
        </div>

        <!-- アクションボタンエリア -->
        <div class="card">
            <p class="card-desc">イベントのご相談や詳細なお見積りについては、下記よりお気軽にお問い合わせください。</p>
            
            <a href="https://lin.ee/xxxxxxx" class="btn btn-line">
                ✨ 公式LINEでお問い合わせ・ご相談
            </a>
            
            <a href="mailto:info@example.com" class="btn btn-mail">
                ✉️ メールでお問い合わせ・お見積り
            </a>
        </div>

        <!-- イベント風景セクション -->
        <div class="section-title">イベント風景</div>

        <div class="gallery-card">
            <div class="image-placeholder">
                イベント風景の写真 01
            </div>
        </div>
    </div>

</body>
</html>
