<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&Princess（アンドプリンセス） | 商業施設・店舗イベント専用プラン</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #9b87a0;
            --accent-pink: #d9a5b3;
            --gold: #dfc187;
            --text-main: #4a404b;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        body {
            /* 背景にお城の画像やグラデーションを敷く設定（bg.jpgの部分をお持ちの画像ファイル名に変えてな！） */
            background-image: linear-gradient(rgba(247, 242, 248, 0.85), rgba(237, 223, 230, 0.85)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px 60px 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .badge {
            background: linear-gradient(135deg, #b2a0b8 0%, #8f7995 100%);
            color: var(--white);
            font-size: 13px;
            font-weight: 500;
            padding: 6px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 12px rgba(155, 135, 160, 0.25);
            letter-spacing: 0.05em;
            margin-top: 10px;
        }

        .hero-text {
            text-align: center;
            line-height: 1.8;
            margin: 10px 0;
        }

        .hero-text h1 {
            font-size: 18px;
            font-weight: 700;
            color: #4a404b;
            margin-bottom: 8px;
            letter-spacing: 0.03em;
        }

        .hero-text p {
            font-size: 14px;
            color: #6d5e6e;
            font-weight: 400;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 2px dashed #e8d7de;
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 24px rgba(180, 150, 165, 0.12);
        }

        .card-desc {
            font-size: 12.5px;
            line-height: 1.7;
            text-align: center;
            color: #6d5e6e;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-line {
            background: linear-gradient(135deg, #d2a4b8 0%, #b88fa3 100%);
            color: var(--white);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .btn-mail {
            background: var(--white);
            color: #6d5e6e;
            border: 1.5px solid #d2a4b8;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: #5c4d5d;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.05em;
            position: relative;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 30px;
            height: 2px;
            background: #d2a4b8;
            margin: 6px auto 0 auto;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.85);
            border: 2px dashed #e8d7de;
            border-radius: 24px;
            padding: 16px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(180, 150, 165, 0.12);
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #f0e6ec;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9b87a0;
            font-size: 13px;
            border: 1px solid #e2d1dc;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部バッジ -->
        <div class="badge">
            商業施設・店舗イベント専用プラン
        </div>

        <!-- キャッチコピー -->
        <div class="hero-text">
            <h1>お城のドレス、カメラのまばたき。<br>小さな憧れに魔法をかけて<br>物語の世界へご案内いたします。</h1>
            <p>各種店舗・商業施設のファミリー集客に。<br>アンケート回答や相談会の強力なフックとなる、<br>出張型ドレス＆撮影会イベント『&Princess』</p>
        </div>

        <!-- アクションボタンエリア -->
        <div class="card">
            <p class="card-desc">イベントのご相談や詳細なお見積りについては、下記よりお気軽にお問い合わせください。</p>
            
            <a href="https://lin.ee/xxxxxxx" class="btn btn-line">
                ✨ 公式LINEでお問い合わせ・ご相談
            </a>
            
            <a href="mailto:info@example.com" class="btn btn-mail">
                ✉️ メールでお問い合わせ・お見積り
            </a>
        </div>

        <!-- イベント風景セクション -->
        <div class="section-title">イベント風景</div>

        <div class="gallery-card">
            <div class="image-placeholder">
                イベント風景の写真 01
            </div>
        </div>
    </div>

</body>
</html>
