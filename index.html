<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>&Princess（アンドプリンセス）- 出張型ドレス＆撮影会イベント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-pink-pale: #fce8f3;
            --color-lavender: #e8d7f5;
            --color-ivory: #fffbf5;
            --color-gold: #dfb15b;
            --color-gold-dark: #c4963e;
            --color-text-main: #5a4b5e;
            --color-text-sub: #84757c;
            --white-trans: rgba(255, 255, 255, 0.75);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #fce8f3 0%, #ecdcf7 40%, #f7effb 70%, #fffbf5 100%);
            color: var(--color-text-main);
            line-height: 1.7;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* 幻想的な光のボケ・レイヤー (多重グラデーション) */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(255, 255, 255, 0.9) 0%, transparent 25%),
                radial-gradient(circle at 80% 30%, rgba(255, 230, 245, 0.7) 0%, transparent 30%),
                radial-gradient(circle at 50% 70%, rgba(240, 220, 255, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 90% 85%, rgba(255, 255, 255, 0.85) 0%, transparent 25%),
                radial-gradient(circle at 10% 90%, rgba(255, 240, 245, 0.6) 0%, transparent 35%);
            pointer-events: none;
            z-index: 0;
        }

        /* パールと輝きのドットエフェクト */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 12% 22%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 88% 12%, #fff 0, #fff 5px, transparent 6px),
                radial-gradient(circle at 28% 68%, #fff 0, #fff 4px, transparent 5px),
                radial-gradient(circle at 72% 78%, #fff 0, #fff 6px, transparent 7px),
                radial-gradient(circle at 45% 40%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 82% 55%, #fff 0, #fff 4px, transparent 5px);
            opacity: 0.6;
            pointer-events: none;
            z-index: 0;
        }

        /* お城・宮殿の幻想的なシルエット背景 */
        .palace-bg-layer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 420px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" preserveAspectRatio="none"><path d="M480,180 L480,120 L490,110 L490,80 L495,75 L495,50 L500,40 L500,20 L505,10 L510,20 L510,40 L515,50 L515,75 L520,80 L520,110 L530,120 L530,180 L580,180 L580,140 L590,125 L590,100 L595,90 L595,75 L605,60 L615,75 L615,90 L620,100 L620,125 L630,140 L630,180 L750,180 L750,220 L1200,450 L0,450 L300,220 L300,180 Z" fill="rgba(255,255,255,0.3)"/></svg>') no-repeat bottom center;
            background-size: cover;
            pointer-events: none;
            z-index: 0;
        }

        /* メインコンテナ（スマートフォン最適幅） */
        .site-container {
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 12px;
        }

        /* ヘッダー */
        header {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 20px;
            border: 1px solid rgba(223, 177, 91, 0.35);
            box-shadow: 0 8px 25px rgba(223, 177, 91, 0.15);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 20px;
            filter: drop-shadow(0 2px 4px rgba(223, 177, 91, 0.4));
        }

        .logo-text {
            font-family: 'Shippori Mincho', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-main);
            letter-spacing: 1px;
        }

        .header-btn {
            background: linear-gradient(135deg, #dfb15b 0%, #c4963e 100%);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(223, 177, 91, 0.35);
            transition: transform 0.2s ease;
        }

        .header-btn:active {
            transform: scale(0.96);
        }

        /* ヒーローセクション */
        .hero {
            text-align: center;
            padding: 15px 10px 25px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.85);
            color: var(--color-text-main);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 22px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(223, 177, 91, 0.45);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.15);
            letter-spacing: 0.5px;
        }

        .hero h1 {
            font-family: 'Shippori Mincho', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--color-text-main);
            line-height: 1.75;
            margin-bottom: 18px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        .hero-desc {
            font-size: 13px;
            color: var(--color-text-sub);
            margin-bottom: 25px;
            line-height: 1.8;
            padding: 0 10px;
        }

        /* 半透明の高級感あるプリンセスカード */
        .princess-card {
            background: var(--white-trans);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 28px 20px;
            margin-bottom: 25px;
            border: 2px dashed rgba(223, 177, 91, 0.5);
            box-shadow: 0 12px 35px rgba(210, 180, 225, 0.25);
            position: relative;
        }

        .princess-card::before {
            content: '👑';
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            background: #fff;
            padding: 0 10px;
            border-radius: 10px;
        }

        .princess-card p {
            font-size: 13.5px;
            color: var(--color-text-sub);
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.7;
        }

        /* 立体的なグラデーションCTAボタン */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-line {
            background: linear-gradient(135deg, #fff5f8 0%, #fce1ee 100%);
            color: #b54574;
            border: 2px solid var(--color-gold);
            box-shadow: 0 6px 20px rgba(223, 177, 91, 0.25);
        }

        .btn-line:hover {
            background: linear-gradient(135deg, #ffe8f2 0%, #fae0ee 100%);
            transform: translateY(-2px);
        }

        .btn-mail {
            background: #ffffff;
            color: var(--color-text-main);
            border: 2px solid #eab6cc;
            box-shadow: 0 4px 15px rgba(234, 182, 204, 0.2);
        }

        .btn-mail:hover {
            background: #fffafc;
            transform: translateY(-2px);
        }

        /* セクション（イベント風景・選ばれる理由） */
        section {
            padding: 10px 0 25px;
        }

        .section-title {
            text-align: center;
            font-family: 'Shippori Mincho', serif;
            font-size: 19px;
            color: var(--color-text-main);
            margin-bottom: 18px;
            font-weight: 600;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 35px;
            height: 3px;
            background: var(--color-gold);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            border: 2px dashed rgba(223, 177, 91, 0.45);
            color: var(--color-text-sub);
            box-shadow: 0 10px 30px rgba(223, 177, 91, 0.15);
        }

        .gallery-card .icon {
            font-size: 38px;
            margin-bottom: 8px;
            color: var(--color-gold);
        }

        .gallery-card p {
            font-size: 13px;
            font-family: 'Shippori Mincho', serif;
        }

        /* 下部固定ブラウザバー（Safari風の上質なデザイン） */
        .browser-bottom-bar {
            background: rgba(245, 238, 248, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(223, 177, 91, 0.35);
            box-shadow:
