<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>&Princess（アンドプリンセス）- 出張型ドレス＆撮影会イベント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-pink-pale: #fce8f3;
            --color-lavender: #e8d7f5;
            --color-ivory: #fffbf5;
            --color-gold: #dfb15b;
            --color-gold-dark: #c4963e;
            --color-text-main: #5a4b5e;
            --color-text-sub: #84757c;
            --white-glass: rgba(255, 255, 255, 0.75);
            --shadow-soft: 0 10px 30px rgba(180, 150, 200, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--color-text-main);
            line-height: 1.8;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 90px;
            
            /* 1. 背景の根本的改善：幻想的な宮殿と光の重なり（CSSグラデーションとSVG/マスクの高度な組み合わせ） */
            background: 
                /* 最下層：幻想的なパステル光のボケ（玉ボケ） */
                radial-gradient(circle at 15% 15%, rgba(255, 255, 255, 0.9) 0%, transparent 20%),
                radial-gradient(circle at 85% 25%, rgba(255, 230, 245, 0.7) 0%, transparent 25%),
                radial-gradient(circle at 50% 70%, rgba(240, 220, 255, 0.8) 0%, transparent 35%),
                radial-gradient(circle at 90% 85%, rgba(255, 255, 255, 0.85) 0%, transparent 22%),
                /* ベースグラデーション：ラベンダー、淡いピンク、アイボリーの自然な重なり */
                linear-gradient(135deg, var(--color-pink-pale) 0%, #e8d7f5 45%, #f7effb 75%, var(--color-ivory) 100%);
            
            /* 2. 装飾と質感の改善：お城と真珠のシルエットを背景レイヤーとして埋め込む */
            background-image: 
                /* お城の幻想的なシルエット（CSSで描画） */
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="none"><path d="M550,150 L550,100 L560,90 L560,70 L565,65 L565,50 L570,45 L570,30 L575,25 L580,30 L580,45 L585,50 L585,65 L590,70 L590,90 L600,100 L600,150 L650,150 L650,120 L660,110 L660,95 L665,90 L665,80 L675,70 L685,80 L685,90 L690,95 L690,110 L700,120 L700,150 L850,150 L850,200 L1200,400 L0,400 L350,200 L350,150 Z" fill="rgba(255,255,255,0.3)"/></svg>'),
                /* 真珠のきらめきエフェクト（CSSで描画） */
                radial-gradient(circle at 10% 20%, #fff 0, #fff 3px, transparent 4px),
                radial-gradient(circle at 80% 15%, #fff 0, #fff 5px, transparent 6px),
                radial-gradient(circle at 20% 80%, #fff 0, #fff 4px, transparent 5px),
                radial-gradient(circle at 70% 90%, #fff 0, #fff 6px, transparent 7px);
            
            background-repeat: no-repeat;
            background-position: 
                bottom center, /* お城 */
                10% 20%, 80% 15%, 20% 80%, 70% 90%; /* 真珠 */
            background-size: 
                100% auto, /* お城 */
                auto auto, auto auto, auto auto, auto auto; /* 真珠 */
        }

        /* メインコンテナ（スマートフォン最適幅） */
        .site-container {
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 12px;
        }

        /* 4. レイアウトの見直：ヘッダーを背景の世界観に自然に溶け込ませる */
        header {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 20px;
            border: 1px solid rgba(223, 177, 91, 0.35);
            box-shadow: var(--shadow-soft);
            margin-bottom: 20px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 20px;
            filter: drop-shadow(0 2px 4px rgba(223, 177, 91, 0.4));
        }

        .logo-text {
            /* 3. 装飾と質感の改善：絵文字を避け、繊細な明朝体ロゴを採用 */
            font-family: 'Shippori Mincho', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--color-text-main);
            letter-spacing: 1px;
        }

        .header-btn {
            /* 3. 装飾と質感の改善：光沢と立体感のあるボタン */
            background: linear-gradient(135deg, #dfb15b 0%, #c4963e 100%);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(223, 177, 91, 0.35);
            transition: transform 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .header-btn:active {
            transform: scale(0.96);
        }

        /* ヒーローセクション */
        .hero {
            text-align: center;
            padding: 15px 10px 25px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.85);
            color: var(--color-text-main);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 22px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(223, 177, 91, 0.45);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.15);
            letter-spacing: 0.5px;
        }

        .hero h1 {
            /* 4. レイアウトの見直し：文字を大きくしすぎず、余白を主役にする */
            font-family: 'Shippori Mincho', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--color-text-main);
            line-height: 1.75;
            margin-bottom: 18px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
        }

        .hero-desc {
            font-size: 13px;
            color: var(--color-text-sub);
            margin-bottom: 25px;
            line-height: 1.8;
            padding: 0 10px;
        }

        /* 3. 装飾と質感の改善：透け感のあるアイボリーカード */
        .princess-card {
            background: var(--white-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 28px;
            padding: 28px 20px;
            margin-bottom: 25px;
            border: 2px dashed rgba(223, 177, 91, 0.5); /* 繊細な点線枠 */
            box-shadow: var(--shadow-soft);
            position: relative;
        }

        .princess-card::before {
            content: '👑'; /* ブランディングとしての王冠は残すが、配置を工夫 */
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            background: #fff;
            padding: 0 10px;
            border-radius: 10px;
        }

        .princess-card p {
            font-size: 13.5px;
            color: var(--color-text-sub);
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.7;
        }

        /* 立体的なグラデーションCTAボタン */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-line {
            background: linear-gradient(135deg, #fff5f8 0%, #fce1ee 100%);
            color: #b54574;
            border: 2px solid var(--color-gold);
            box-shadow: 0 6px 20px rgba(223, 177, 91, 0.25);
        }

        .btn-line:hover {
            background: linear-gradient(135deg, #ffe8f2 0%, #fae0ee 100%);
            transform: translateY(-2px);
        }

        .btn-mail {
            background: #ffffff;
            color: var(--color-text-main);
            border: 2px solid #eab6cc;
            box-shadow: 0 4px 15px rgba(234, 182, 204, 0.2);
        }

        .btn-mail:hover {
            background: #fffafc;
            transform: translateY(-2px);
        }

        /* セクション（イベント風景・選ばれる理由） */
        section {
            padding: 10px 0 25px;
        }

        .section-title {
            text-align: center;
            font-family: 'Shippori Mincho', serif;
            font-size: 19px;
            color: var(--color-text-main);
            margin-bottom: 18px;
            font-weight: 600;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 35px;
            height: 3px;
            background: var(--color-gold);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            border: 2px dashed rgba(223, 177, 91, 0.45);
            color: var(--color-text-sub);
            box-shadow: 0 10px 30px rgba(223, 177, 91, 0.15);
        }

        .gallery-card .icon {
            font-size: 38px;
            margin-bottom: 8px;
            color: var(--color-gold);
        }

        .gallery-card p {
            font-size: 13px;
            font-family: 'Shippori Mincho', serif;
        }

        /* 下部固定ブラウザバー（Safari風の上質なデザイン） */
        .browser-bottom-bar {
            background: rgba(245, 238, 248, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(223, 177, 91, 0.35);
            box-shadow: 0 -5px 25px rgba(223, 177, 91, 0.15);
            z-index: 100;
        }

        .bar-icon {
            font-size: 18px;
            color: var(--color-text-main);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="site-container">
        <!-- ヘッダー -->
        <header>
            <a href="#" class="logo-area">
                <span class="logo-icon">👑</span>
                <span class="logo-text">&Princess</span>
            </a>
            <button class="header-btn">ご相談・お見積り</button>
        </header>

        <!-- ヒーローセクション -->
        <div class="hero">
            <div class="hero-badge">商業施設・店舗イベント専用プラン</div>
            <h1>
                お城のドレス、カメラのまばたき。<br>
                小さな憧れに魔法をかけて<br>
                物語の世界へご案内いたします。
            </h1>
            <p class="hero-desc">
                各種店舗・商業施設のファミリー集客に。<br>
                アンケート回答や相談会の強力なフックとなる、<br>
                出張型ドレス＆撮影会イベント『&Princess』
            </p>

            <!-- メインカードとCTA -->
            <div class="princess-card">
                <p>お気軽にお問い合わせ・お見積り・ご相談ください</p>
                <div class="cta-container">
                    <a href="#" class="btn btn-line">
                        ✨ 公式LINEでお問い合わせ・ご相談
                    </a>
                    <a href="#" class="btn btn-mail">
                        ✉️ メールでお問い合わせ・お見積り
                    </a>
                </div>
            </div>
        </div>

        <!-- イベント風景 -->
        <section>
            <h2 class="section-title">イベント風景</h2>
            <div class="gallery-card">
                <div class="icon">🏰</div>
                <p>イベント風景 01</p>
            </div>
        </section>
    </div>

    <!-- スマホ下部ブラウザバー -->
    <div class="browser-bottom-bar">
        <span class="bar-icon">💎</span>
        <span class="bar-icon">👑</span>
        <span class="bar-icon">✨</span>
        <span class="bar-icon">📖</span>
        <span class="bar-icon">❏</span>
    </div>

</body>
</html>
