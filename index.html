<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>&Princess（アンドプリンセス）- 出張型ドレス＆撮影会イベント</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ivory-glass: rgba(255, 253, 250, 0.85);
            --color-gold: #dfb15b;
            --color-gold-dark: #c4963e;
            --color-text-main: #5a4b5e;
            --color-text-sub: #7a6b72;
            --shadow-princess: 0 15px 40px rgba(180, 150, 200, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            color: var(--color-text-main);
            line-height: 1.8;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            padding-bottom: 110px; /* 下部ブラウザバーのスペース */
            
            /* 1. 背景の根本的改善：幻想的なお城・宮殿の写真素材と、パステル光の重なり */
            background-color: #f7effb;
            background-image: 
                /* 柔らかな光のヴェール（ピンク＆ラベンダーの重なり） */
                linear-gradient(135deg, rgba(252, 232, 243, 0.82) 0%, rgba(232, 215, 245, 0.80) 50%, rgba(255, 251, 245, 0.85) 100%),
                /* 実写の宮殿・お城の高画質背景写真（商用利用可能リンク） */
                url('https://images.unsplash.com/photo-1541971875076-8f970d573be6?q=80&w=1200&auto=format&fit=crop');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            background-attachment: fixed;
        }

        /* 幻想的な光の玉ボケ・きらめきレイヤー */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(255, 255, 255, 0.9) 0%, transparent 25%),
                radial-gradient(circle at 85% 25%, rgba(255, 220, 240, 0.6) 0%, transparent 30%),
                radial-gradient(circle at 50% 80%, rgba(235, 210, 255, 0.7) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
        }

        /* メインコンテナ（スマートフォン最適幅） */
        .site-container {
            max-width: 440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 16px 12px;
        }

        /* ヘッダー */
        header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 22px;
            border: 1px solid rgba(223, 177, 91, 0.4);
            box-shadow: 0 8px 30px rgba(223, 177, 91, 0.18);
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .logo-icon {
            font-size: 20px;
            filter: drop-shadow(0 2px 5px rgba(223, 177, 91, 0.5));
        }

        .logo-text {
            font-family: 'Shippori Mincho', serif;
            font-size: 21px;
            font-weight: 600;
            color: var(--color-text-main);
            letter-spacing: 1.2px;
        }

        .header-btn {
            background: linear-gradient(135deg, #dfb15b 0%, #c4963e 100%);
            color: #ffffff;
            padding: 7px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.35);
            letter-spacing: 0.5px;
            transition: transform 0.2s ease;
        }

        .header-btn:active {
            transform: scale(0.96);
        }

        /* ヒーローセクション */
        .hero {
            text-align: center;
            padding: 10px 4px 25px;
        }

        .hero-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.9);
            color: var(--color-text-main);
            font-size: 12px;
            font-weight: 700;
            padding: 6px 24px;
            border-radius: 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(223, 177, 91, 0.5);
            box-shadow: 0 4px 15px rgba(223, 177, 91, 0.15);
            letter-spacing: 0.5px;
        }

        /* 4. スマートフォンの表示修正：文字サイズと折り返しの最適化 */
        .hero h1 {
            font-family: 'Shippori Mincho', serif;
            font-size: 20.5px;
            font-weight: 500;
            color: var(--color-text-main);
            line-height: 1.75;
            margin-bottom: 20px;
            text-shadow: 0 2px 12px rgba(255, 255, 255, 0.95);
            word-break: normal;
            overflow-wrap: break-word;
        }

        .hero-desc {
            font-size: 13px;
            color: var(--color-text-sub);
            margin-bottom: 28px;
            line-height: 1.85;
            padding: 0 8px;
            font-weight: 400;
        }

        /* 2. 半透明のアイボリーカード（繊細な点線枠とパール調の輝き） */
        .princess-card {
            background: var(--color-ivory-glass);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 28px;
            padding: 30px 20px;
            margin-bottom: 28px;
            border: 2px dashed rgba(223, 177, 91, 0.55);
            box-shadow: var(--shadow-princess);
            position: relative;
        }

        .princess-card::before {
            content: '👑';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            background: #ffffff;
            padding: 0 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(223, 177, 91, 0.25);
        }

        .princess-card p {
            font-size: 13.5px;
            color: var(--color-text-sub);
            margin-bottom: 22px;
            text-align: center;
            line-height: 1.75;
        }

        /* 立体的なグラデーションCTAボタン */
        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 40px;
            text-decoration: none;
            font-weight: 700;
            font-size: 14.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-line {
            background: linear-gradient(135deg, #fff5f8 0%, #fce1ee 100%);
            color: #b54574;
            border: 2px solid var(--color-gold);
            box-shadow: 0 6px 20px rgba(223, 177, 91, 0.3);
        }

        .btn-line:hover {
            background: linear-gradient(135deg, #ffe8f2 0%, #fae0ee 100%);
            transform: translateY(-2px);
        }

        .btn-mail {
            background: #ffffff;
            color: var(--color-text-main);
            border: 2px solid #eab6cc;
            box-shadow: 0 4px 15px rgba(234, 182, 204, 0.25);
        }

        .btn-mail:hover {
            background: #fffafc;
            transform: translateY(-2px);
        }

        /* セクション（イベント風景・選ばれる理由） */
        section {
            padding: 10px 0 20px;
        }

        .section-title {
            text-align: center;
            font-family: 'Shippori Mincho', serif;
            font-size: 19.5px;
            color: var(--color-text-main);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .section-title::after {
            content: '';
            display: block;
            width: 38px;
            height: 3px;
            background: var(--color-gold);
            margin: 8px auto 0;
            border-radius: 2px;
        }

        .gallery-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 32px 20px;
            text-align: center;
            border: 2px dashed rgba(223, 177, 91, 0.5);
            color: var(--color-text-sub);
            box-shadow: 0 12px 35px rgba(223, 177, 91, 0.18);
        }

        .gallery-card .icon {
            font-size: 40px;
            margin-bottom: 10px;
            color: var(--color-gold);
            filter: drop-shadow(0 2px 4px rgba(223, 177, 91, 0.3));
        }

        .gallery-card p {
            font-size: 13.5px;
            font-family: 'Shippori Mincho', serif;
        }

        /* スマホ下部ブラウザバー（Safari風の上質なデザイン） */
        .browser-bottom-bar {
            background: rgba(245, 238, 248, 0.94);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 12px 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(223, 177, 91, 0.35);
            box-shadow: 0 -5px 25px rgba(223, 177, 91, 0.15);
            z-index: 100;
        }

        .bar-icon {
            font-size: 18px;
            color: var(--color-text-main);
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="site-container">
        <!-- ヘッダー -->
        <header>
            <a href="#" class="logo-area">
                <span class="logo-icon">👑</span>
                <span class="logo-text">&Princess</span>
            </a>
            <a href="#" class="header-btn">ご相談・お見積り</a>
        </header>

        <!-- ヒーローセクション -->
        <div class="hero">
            <div class="hero-badge">商業施設・店舗イベント専用プラン</div>
            <h1>
                お城のドレス、カメラのまばたき。<br>
                小さな憧れに魔法をかけて<br>
                物語の世界へご案内いたします。
            </h1>
            <p class="hero-desc">
                各種店舗・商業施設のファミリー集客に。<br>
                アンケート回答や相談会の強力なフックとなる、<br>
                出張型ドレス＆撮影会イベント『&Princess』
            </p>

            <!-- メインカードとCTA -->
            <div class="princess-card">
                <p>お気軽にお問い合わせ・お見積り・ご相談ください</p>
                <div class="cta-container">
                    <a href="#" class="btn btn-line">
                        ✨ 公式LINEでお問い合わせ・ご相談
                    </a>
                    <a href="#" class="btn btn-mail">
                        ✉️ メールでお問い合わせ・お見積り
                    </a>
                </div>
            </div>
        </div>

        <!-- 選ばれる理由 / イベント風景 -->
        <section>
            <h2 class="section-title">&Princessが選ばれる理由</h2>
            <div class="gallery-card">
                <div class="icon">🏰</div>
                <p>物語の世界へ誘う上質なイベント風景 01</p>
            </div>
        </section>
    </div>

    <!-- スマホ下部ブラウザバー -->
    <div class="browser-bottom-bar">
        <span class="bar-icon">💎</span>
        <span class="bar-icon">👑</span>
        <span class="bar-icon">✨</span>
        <span class="bar-icon">📖</span>
        <span class="bar-icon">❏</span>
    </div>

</body>
</html>
